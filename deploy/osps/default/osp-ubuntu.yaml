apiVersion: operatingsystemmanager.k8c.io/v1alpha1
kind: OperatingSystemProfile
metadata:
  name: osp-ubuntu
  namespace: kube-system
spec:
  osName: "ubuntu"
  osVersion: "24.04"
  version: "v1.11.9"
  provisioningUtility: "cloud-init"
  supportedCloudProviders:
    - name: "alibaba"
    - name: "aws"
    - name: "azure"
    - name: "baremetal"
    - name: "digitalocean"
    - name: "edge"
    - name: "gce"
    - name: "hetzner"
    - name: "kubevirt"
    - name: "nutanix"
    - name: "openstack"
    - name: "vmware-cloud-director"
    - name: "vsphere"

  bootstrapConfig:
    templates:
      configureProxyScript: |-
        {{- if .HTTPProxy }}
        cat <<EOF | tee -a /etc/environment
        HTTP_PROXY={{ .HTTPProxy }}
        http_proxy={{ .HTTPProxy }}
        HTTPS_PROXY={{ .HTTPProxy }}
        https_proxy={{ .HTTPProxy }}
        EOF
        {{- end }}

        {{- if .NoProxy }}
        cat <<EOF | tee -a /etc/environment
        NO_PROXY={{ .NoProxy }}
        no_proxy={{ .NoProxy }}
        EOF
        {{- end }}

        sudo mkdir -p /etc/apt/apt.conf.d
        cat <<EOF | sudo tee /etc/apt/apt.conf.d/proxy.conf
        {{- if .HTTPProxy }}
        Acquire::https::Proxy "{{ .HTTPProxy }}";
        Acquire::http::Proxy "{{ .HTTPProxy }}";
        {{- end }}
        EOF

        source /etc/environment

    files:
      - path: /opt/bin/supervise.sh
        permissions: 755
        content:
          inline:
            encoding: b64
            data: |
              #!/bin/bash
              set -xeuo pipefail
              while ! "$@"; do
                sleep 1
              done

      - path: /opt/bin/bootstrap
        permissions: 755
        content:
          inline:
            encoding: b64
            data: |
              #!/bin/bash
              set -xeuo pipefail

              # Check if bootstrap phase has already completed. This is required when we run `cloud-init init` again since it tries to re-run
              # the bootstrap cloud-config as well, from the userdata.
              if [ -f /etc/bootstrap-complete ]; then
                exit 0
              fi

              {{- /* Configure proxy as the first step to ensure that all the phases of provisioning respect the proxy environment. */}}
              {{- template "configureProxyScript" }}

              {{- /* Starting with Ubuntu 24.04, there is an issue with DNS resolution that leaves machines without connectivity consistently. We even observed this issue on machines
              where the netplan wasn't executed in the second cloud-init run. To fix this we are adding Cloudfare as fallback for DNS resolution */}}
              {{- if eq .CloudProviderName "hetzner" }}
              sed -i '/\[Resolve\]/a FallbackDNS=1.1.1.1#cloudflare-dns.com 1.0.0.1#cloudflare-dns.com 2606:4700:4700::1111#cloudflare-dns.com 2606:4700:4700::1001#cloudflare-dns.com' /etc/systemd/resolved.conf
              systemctl restart systemd-resolved

              # Backup default netplan config
              cp /etc/netplan/50-cloud-init.yaml /etc/netplan-50-cloud-init.yaml.bak
              {{- end }}

              export DEBIAN_FRONTEND=noninteractive
              apt update && apt install -y curl jq
              curl -s -k -v --header 'Authorization: Bearer {{ .Token }}'	{{ .ServerURL }}/api/v1/namespaces/cloud-init-settings/secrets/{{ .SecretName }} | jq '.data["cloud-config"]' -r| base64 -d > /etc/cloud/cloud.cfg.d/{{ .SecretName }}.cfg
              cloud-init clean

              {{- /* Azure's cloud-init provider integration has changed recently (end of April 2024) and now requires us to run this command below once to set some files up that seem required for another cloud-init run. */}}
              {{- if (eq .CloudProviderName "azure") }}
              cloud-init init --local
              {{- end }}

              {{- /* The default cloud-init configurations files have a bug on Digital Ocean that causes the machine to be in-accessible on the 2nd cloud-init run. */}}
              {{- if (eq .CloudProviderName "digitalocean") }}
              rm /etc/netplan/50-cloud-init.yaml
              echo "network: {config: disabled}" > /etc/cloud/cloud.cfg.d/99-custom-networking.cfg
              {{- end }}

              CLOUD_INIT_VERSION=$(cloud-init --version | awk '{print $2}')
              # Compare the semver values of cloud-init versions to determine the correct command to run.
              # This is required because the command line arguments for cloud-init changed in version 24.1, for details: https://github.com/canonical/cloud-init/releases/tag/24.1.
              if [[ $(echo -e "24.0.0\n$CLOUD_INIT_VERSION" | sort -V | head -n1) = "24.0.0" ]]; then
                  cloud-init init --file /etc/cloud/cloud.cfg.d/{{ .SecretName }}.cfg
              else
                  cloud-init --file /etc/cloud/cloud.cfg.d/{{ .SecretName }}.cfg init
              fi

              systemctl daemon-reload

              {{- if eq .CloudProviderName "digitalocean" }}
              netplan generate
              netplan apply
              {{- end }}

              {{- if eq .CloudProviderName "hetzner" }}
              # Restore default netplan config
              cp /etc/netplan-50-cloud-init.yaml.bak /etc/netplan/50-cloud-init.yaml
              systemctl daemon-reload
              netplan apply
              systemctl restart systemd-networkd
              {{- end }}

              systemctl daemon-reload

              # cloud-init should only run on the first boot. From this point forward we don't need cloud-init anymore.
              systemctl disable cloud-init
              touch /etc/cloud/cloud-init.disabled

              # Bootstrap phase for the machine is complete.
              touch /etc/bootstrap-complete
              systemctl disable bootstrap.service

              # Start provisioning phase for the machine.
              systemctl restart setup.service

      - path: /etc/systemd/system/bootstrap.service
        permissions: 644
        content:
          inline:
            encoding: b64
            data: |
              [Install]
              WantedBy=multi-user.target

              [Unit]
              Requires=network-online.target
              After=network-online.target
              [Service]
              Type=oneshot
              RemainAfterExit=true
              EnvironmentFile=-/etc/environment
              ExecStart=/opt/bin/supervise.sh /opt/bin/bootstrap

    modules:
      runcmd:
        - systemctl restart bootstrap.service
        - systemctl daemon-reload

  provisioningConfig:
    supportedContainerRuntimes:
      - name: containerd
        files:
          - path: /etc/systemd/system/containerd.service.d/environment.conf
            content:
              inline:
                data: |
                  [Service]
                  Restart=always
                  EnvironmentFile=-/etc/environment

          - path: /etc/systemd/system/containerd.service.d/limits.conf
            permissions: 644
            content:
              inline:
                data: |
                  [Service]
                  LimitNOFILE=1048576

          - path: /etc/crictl.yaml
            content:
              inline:
                data: |
                  runtime-endpoint: unix:///run/containerd/containerd.sock

          - path: /etc/containerd/config.toml
            permissions: 600
            content:
              inline:
                encoding: b64
                data: |
                  {{ .ContainerRuntimeConfig }}
        templates:
          containerRuntimeInstallation: |-
            apt-get update
            apt-get install -y apt-transport-https ca-certificates curl software-properties-common lsb-release
            install -m 0755 -d /etc/apt/keyrings
            curl -fsSL https://download.docker.com/linux/$(lsb_release -si | tr '[:upper:]' '[:lower:]')/gpg | gpg --yes --dearmor -o /etc/apt/keyrings/docker.gpg
            echo "deb [signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/$(lsb_release -si | tr '[:upper:]' '[:lower:]') $(lsb_release -cs) stable" | tee /etc/apt/sources.list.d/docker.list

            apt-get update
            apt-get install -y --allow-downgrades -o Dpkg::Options::="--force-confold" containerd.io=2.2*
            apt-mark hold containerd.io

            systemctl daemon-reload
            systemctl enable --now containerd

    templates:
      safeDownloadBinariesScript: |-
        {{- /* setup some common directories */}}
        opt_bin=/opt/bin
        usr_local_bin=/usr/local/bin
        cni_bin_dir=/opt/cni/bin

        {{- /* create all the necessary dirs */}}
        mkdir -p /etc/cni/net.d /etc/kubernetes/manifests "$opt_bin" "$cni_bin_dir"
        {{- /* HOST_ARCH can be defined outside of machine-controller (in kubeone for example) */}}
        arch=${HOST_ARCH-}
        if [ -z "$arch" ]
        then
        case $(uname -m) in
        x86_64)
            arch="amd64"
            ;;
        aarch64)
            arch="arm64"
            ;;
        *)
            echo "unsupported CPU architecture, exiting"
            exit 1
            ;;
        esac
        fi

        {{- /* # CNI variables */}}
        CNI_VERSION="${CNI_VERSION:-v1.9.1}"
        cni_base_url="https://github.com/containernetworking/plugins/releases/download/$CNI_VERSION"
        cni_filename="cni-plugins-linux-$arch-$CNI_VERSION.tgz"

        {{- /* download CNI */}}
        curl -Lfo "$cni_bin_dir/$cni_filename" "$cni_base_url/$cni_filename"

        {{- /* download CNI checksum */}}
        cni_sum=$(curl -Lf "$cni_base_url/$cni_filename.sha256")
        cd "$cni_bin_dir"

        {{- /* verify CNI checksum */}}
        sha256sum -c <<<"$cni_sum"

        {{- /* unpack CNI */}}
        tar xvf "$cni_filename"
        rm -f "$cni_filename"
        cd -

        {{- /* set ownership of the CNI binaries to root:root. Required due to https://github.com/cilium/cilium/issues/23838 */}}
        chown -R root:root "$cni_bin_dir"

        {{- /* # cri-tools variables */}}
        {{- if semverCompare "~1.33.0" .KubeVersion }}
        CRI_TOOLS_RELEASE="v1.33.0"
        {{- else if semverCompare "~1.34.0" .KubeVersion }}
        CRI_TOOLS_RELEASE="v1.34.0"
        {{- else if semverCompare "~1.35.0" .KubeVersion }}
        CRI_TOOLS_RELEASE="v1.35.0"
        {{- else if semverCompare "~1.36.0" .KubeVersion }}
        CRI_TOOLS_RELEASE="v1.36.0"
        {{- else if semverCompare "~1.37.0" .KubeVersion }}
        CRI_TOOLS_RELEASE="v1.37.0"
        {{- else }}
        {{- /* Fallback to the latest version */}}
        CRI_TOOLS_RELEASE="v1.37.0"
        {{- end }}

        cri_tools_base_url="https://github.com/kubernetes-sigs/cri-tools/releases/download/${CRI_TOOLS_RELEASE}"
        cri_tools_filename="crictl-${CRI_TOOLS_RELEASE}-linux-${arch}.tar.gz"

        {{- /* download cri-tools */}}
        curl -Lfo "$opt_bin/$cri_tools_filename" "$cri_tools_base_url/$cri_tools_filename"

        {{- /* download cri-tools checksum */}}
        {{- /* the cri-tools checksum file provides only the checksum without the file name, so we need to handle it specially */}}
        cri_tools_sum_value=$(curl -Lf "$cri_tools_base_url/$cri_tools_filename.sha256")
        cri_tools_sum="$cri_tools_sum_value $cri_tools_filename"
        cd "$opt_bin"

        {{- /* verify cri-tools checksum */}}
        sha256sum -c <<<"$cri_tools_sum"

        {{- /* unpack cri-tools and symlink to path so it's available to all users */}}
        tar xvf "$cri_tools_filename"
        rm -f "$cri_tools_filename"
        ln -sf "$opt_bin/crictl" "$usr_local_bin"/crictl || echo "symbolic link is skipped"
        cd -

        {{- /* kubelet */}}
        KUBE_VERSION="${KUBE_VERSION:-{{ .KubeVersion }}}"
        kube_dir="$opt_bin/kubernetes-$KUBE_VERSION"
        kube_base_url="https://dl.k8s.io/$KUBE_VERSION/bin/linux/$arch"
        kube_sum_file="$kube_dir/sha256"

        {{- /* create versioned kube dir */}}
        mkdir -p "$kube_dir"
        : >"$kube_sum_file"

        for bin in kubelet kubeadm kubectl; do
            {{- /* download kube binary */}}
            curl -Lfo "$kube_dir/$bin" "$kube_base_url/$bin"
            chmod +x "$kube_dir/$bin"

            {{- /* download kube binary checksum */}}
            sum=$(curl -Lf "$kube_base_url/$bin.sha256")

            {{- /* save kube binary checksum */}}
            echo "$sum  $kube_dir/$bin" >>"$kube_sum_file"
        done

        {{- /* check kube binaries checksum */}}
        sha256sum -c "$kube_sum_file"

        for bin in kubelet kubeadm kubectl; do
            {{- /* link kube binaries from versioned dir to $opt_bin */}}
            ln -sf "$kube_dir/$bin" "$opt_bin"/$bin
        done

      configureHostCABundle: |-
        {{- with .HostCACert }}
        cat <<EOF | sudo tee /usr/local/share/ca-certificates/custom.crt
        {{ . }}
        EOF
        sudo update-ca-certificates
        {{- end }}

    files:
      - path: /etc/systemd/journald.conf.d/max_disk_use.conf
        content:
          inline:
            encoding: b64
            data: |
              [Journal]
              SystemMaxUse={{ .JournaldSystemMaxUse }}

      - path: /opt/load-kernel-modules.sh
        permissions: 755
        content:
          inline:
            encoding: b64
            data: |
              #!/usr/bin/env bash
              set -euo pipefail

              modprobe ip_vs
              modprobe ip_vs_rr
              modprobe ip_vs_wrr
              modprobe ip_vs_sh

              if modinfo nf_conntrack_ipv4 &> /dev/null; then
                modprobe nf_conntrack_ipv4
              else
                modprobe nf_conntrack
              fi
              modprobe br_netfilter

      - path: /etc/sysctl.d/k8s.conf
        content:
          inline:
            encoding: b64
            data: |
              net.bridge.bridge-nf-call-ip6tables = 1
              net.bridge.bridge-nf-call-iptables = 1
              kernel.panic_on_oops = 1
              kernel.panic = 10
              net.ipv4.ip_forward = 1
              {{- if or (eq .NetworkIPFamily "IPv4+IPv6") (eq .NetworkIPFamily "IPv6+IPv4") (eq .NetworkIPFamily "IPv6") }}
              net.ipv6.conf.all.forwarding = 1
              # Configure Linux to accept router advertisements to ensure the default
              # IPv6 route is not removed from the routing table when the Docker service starts.
              # For more information: https://github.com/docker/for-linux/issues/844
              net.ipv6.conf.all.accept_ra		= 2
              {{- end }}
              vm.overcommit_memory = 1
              fs.inotify.max_user_watches = 1048576
              fs.inotify.max_user_instances = 8192

      - path: /etc/default/grub.d/60-swap-accounting.cfg
        content:
          inline:
            encoding: b64
            data: |
              # Added by kubermatic machine-controller
              # Enable cgroups memory and swap accounting
              GRUB_CMDLINE_LINUX="cgroup_enable=memory swapaccount=1"

      - path: /opt/bin/setup
        permissions: 755
        content:
          inline:
            encoding: b64
            data: |
              #!/bin/bash
              set -xeuo pipefail
              if systemctl is-active ufw; then systemctl stop ufw; fi
              systemctl mask ufw


              {{- /* As we added some modules and don't want to reboot, restart the service */}}
              systemctl restart systemd-modules-load.service
              sysctl --system

              # Override hostname if /etc/machine-name exists
              if [ -x "$(command -v hostnamectl)" ] && [ -s /etc/machine-name ]; then
                machine_name=$(cat /etc/machine-name)
                hostnamectl set-hostname ${machine_name}
              fi

              {{- template "configureHostCABundle" }}

              apt-get update

              DEBIAN_FRONTEND=noninteractive apt-get -o Dpkg::Options::="--force-confdef" -o Dpkg::Options::="--force-confold" install -y \
                curl \
                ca-certificates \
                ceph-common \
                cifs-utils \
                conntrack \
                e2fsprogs \
                ebtables \
                ethtool \
                glusterfs-client \
                iptables \
                jq \
                kmod \
                openssh-client \
                nfs-common \
                socat \
                util-linux \
                {{- if or (eq .CloudProviderName "vsphere") (eq .CloudProviderName "vmware-cloud-director") }}
                open-vm-tools \
                {{- end }}
                {{- if eq .CloudProviderName "nutanix" }}
                open-iscsi \
                {{- end }}
                {{- if eq .CloudProviderName "kubevirt" }}
                qemu-guest-agent \
                {{- end }}
                ipvsadm

              {{- /* iscsid service is required on Nutanix machines for CSI driver to attach volumes. */}}
              {{- if eq .CloudProviderName "nutanix" }}
              systemctl enable --now iscsid
              {{ end }}

              {{- /* qemu-guest-agent is required on KubeVirt machines for guest OS info reporting and command execution. */}}
              {{- if eq .CloudProviderName "kubevirt" }}
              systemctl enable --now qemu-guest-agent
              {{ end }}

              {{- template "safeDownloadBinariesScript" }}

              {{- template "containerRuntimeInstallation" }}

              # set kubelet nodeip environment variable
              /opt/bin/setup_net_env.sh

              {{- /* fetch kubelet bootstrapping kubeconfig */}}
              curl -s -k -v --header 'Authorization: Bearer {{ .Token }}' {{ .ServerURL }}/api/v1/namespaces/cloud-init-settings/secrets/{{ .BootstrapKubeconfigSecretName }} | jq '.data["kubeconfig"]' -r| base64 -d > /etc/kubernetes/bootstrap-kubelet.conf

              systemctl enable --now kubelet
              systemctl enable --now kubelet-healthcheck.timer

              {{- /* Hardening runs last, after kubelet is up, and is never fatal to provisioning. */}}
              /bin/bash /opt/bin/harden.sh > /var/log/harden.log 2>&1 || echo "WARNING: /opt/bin/harden.sh reported errors - see /var/log/harden.log"

              systemctl disable setup.service

      - path: /etc/systemd/system/kubelet.service
        permissions: 600
        content:
          inline:
            encoding: b64
            data: |
              [Unit]
              After={{ .ContainerRuntime }}.service
              Wants={{ .ContainerRuntime }}.service

              Description=kubelet: The Kubernetes Node Agent
              Documentation=https://kubernetes.io/docs/home/

              [Service]
              User=root
              Restart=always
              StartLimitInterval=0
              RestartSec=10
              CPUAccounting=true
              MemoryAccounting=true
              {{- /* Native systemd watchdog: the kubelet sends sd_notify keep-alives tied to its internal health; systemd restarts it on missed heartbeats via Restart=. */}}
              WatchdogSec=30s

              Environment="PATH=/opt/bin:/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin/"
              EnvironmentFile=-/etc/environment

              ExecStartPre=/bin/bash /opt/disable-swap.sh
              ExecStartPre=/bin/bash /opt/load-kernel-modules.sh
              ExecStartPre=/bin/bash /opt/bin/setup_net_env.sh
              ExecStart=/opt/bin/kubelet \
                --bootstrap-kubeconfig=/etc/kubernetes/bootstrap-kubelet.conf \
                --kubeconfig=/var/lib/kubelet/kubeconfig \
                --config=/etc/kubernetes/kubelet.conf \
                --cert-dir=/etc/kubernetes/pki \
                {{- if .ExternalCloudProvider }}
                --cloud-provider=external \
                {{- /* In-tree cloud providers have been disabled starting from k8s 1.29. For more information: https://github.com/kubernetes/kubernetes/pull/117503 */}}
                {{- else if and (.InTreeCCMAvailable) (semverCompare "<1.29" .KubeVersion) }}
                --cloud-provider={{- .CloudProviderName }} \
                --cloud-config=/etc/kubernetes/cloud-config \
                {{- end }}
                {{- if and (ne .CloudProviderName "aws") (ne .CloudProviderName "openstack") }}
                --hostname-override=${KUBELET_HOSTNAME} \
                {{- else if and (eq .CloudProviderName "aws") (.ExternalCloudProvider) }}
                --hostname-override=${KUBELET_HOSTNAME} \
                {{- end }}
                {{- if .InitialTaints }}
                --register-with-taints={{- .InitialTaints }} \
                {{- end }}
                {{- if eq .ContainerRuntime "containerd" }}
                --container-runtime-endpoint=unix:///run/containerd/containerd.sock \
                {{- end }}
                {{- /* If external or in-tree CCM is in use we don't need to set --node-ip as the cloud provider will know what IPs to return.  */}}
                {{- if not (and (or (eq .NetworkIPFamily "IPv4+IPv6") (eq .NetworkIPFamily "IPv6+IPv4")) (or (.InTreeCCMAvailable) (.ExternalCloudProvider))) }}
                --node-ip ${KUBELET_NODE_IP}
                {{- end }}

              [Install]
              WantedBy=multi-user.target

      - path: /etc/systemd/system/kubelet-healthcheck.service
        permissions: 644
        content:
          inline:
            encoding: b64
            data: |
              [Unit]
              Description=Check kubelet health

              [Service]
              Type=oneshot
              ExecStart=/bin/sh -c 'if ! curl -m 10 -fsS http://127.0.0.1:10248/healthz >/dev/null; then logger -t kubelet-healthcheck "kubelet unhealthy, restarting"; systemctl restart kubelet; fi'

      - path: /etc/systemd/system/kubelet-healthcheck.timer
        permissions: 644
        content:
          inline:
            encoding: b64
            data: |
              [Unit]
              Description=Run kubelet health check every 30s

              [Timer]
              OnActiveSec=120
              OnUnitActiveSec=30

              [Install]
              WantedBy=timers.target

      - path: /etc/kubernetes/cloud-config
        permissions: 600
        content:
          inline:
            encoding: b64
            data: |
              {{ .CloudConfig }}

      - path: /opt/bin/setup_net_env.sh
        permissions: 755
        content:
          inline:
            encoding: b64
            data: |
              #!/usr/bin/env bash
              echodate() {
                echo "[$(date -Is)]" "$@"
              }

              # get the default interface IP address
              {{- if eq .NetworkIPFamily "IPv6" }}
              DEFAULT_IFC_IP=$(ip -o -6 route get  1:: | grep -oP "src \K\S+")
              {{- else if eq .NetworkIPFamily "IPv4+IPv6" }}
              DEFAULT_IFC_IPv4=$(ip -o route get  1 | grep -oP "src \K\S+")
              DEFAULT_IFC_IPv6=$(ip -o -6 route get  1:: | grep -oP "src \K\S+")

              if [ -z "${DEFAULT_IFC_IPv6}" ]
              then
                echodate "Failed to get IPv6 address for the default route interface"
                exit 1
              fi
              DEFAULT_IFC_IP=$DEFAULT_IFC_IPv4,$DEFAULT_IFC_IPv6
              {{- else if eq .NetworkIPFamily "IPv6+IPv4" }}
              DEFAULT_IFC_IPv4=$(ip -o route get  1 | grep -oP "src \K\S+")
              DEFAULT_IFC_IPv6=$(ip -o -6 route get  1:: | grep -oP "src \K\S+")

              if [ -z "${DEFAULT_IFC_IPv6}" ]
              then
                echodate "Failed to get IPv6 address for the default route interface"
                exit 1
              fi

              DEFAULT_IFC_IP=$DEFAULT_IFC_IPv6,$DEFAULT_IFC_IPv4
              {{- else }}
              DEFAULT_IFC_IP=$(ip -o  route get 1 | grep -oP "src \K\S+")
              {{- end }}

              if [ -z "${DEFAULT_IFC_IP}" ]
              then
                echodate "Failed to get IP address for the default route interface"
                exit 1
              fi

              # get the full hostname
              FULL_HOSTNAME=$(hostname -f)
              # if /etc/machine-name is not empty then use the hostname from there
              if [ -s /etc/machine-name ]; then
                FULL_HOSTNAME=$(cat /etc/machine-name)
              fi

              # write the nodeip_env file
              # we need the line below because flatcar has the same string "coreos" in that file
              if grep -q coreos /etc/os-release
              then
                echo "KUBELET_NODE_IP=${DEFAULT_IFC_IP}\nKUBELET_HOSTNAME=${FULL_HOSTNAME}" > /etc/kubernetes/nodeip.conf
              else
                mkdir -p /etc/systemd/system/kubelet.service.d
                echo -e "[Service]\nEnvironment=\"KUBELET_NODE_IP=${DEFAULT_IFC_IP}\"\nEnvironment=\"KUBELET_HOSTNAME=${FULL_HOSTNAME}\"" > /etc/systemd/system/kubelet.service.d/nodeip.conf
              fi

      - path: /etc/kubernetes/pki/ca.crt
        content:
          inline:
            encoding: b64
            data: |
              {{ .KubernetesCACert }}

      - path: /etc/systemd/system/setup.service
        permissions: 644
        content:
          inline:
            encoding: b64
            data: |
              [Install]
              WantedBy=multi-user.target

              [Unit]
              Requires=network-online.target
              After=network-online.target

              [Service]
              Type=oneshot
              RemainAfterExit=true
              EnvironmentFile=-/etc/environment
              ExecStart=/opt/bin/supervise.sh /opt/bin/setup

      - path: /etc/profile.d/opt-bin-path.sh
        permissions: 644
        content:
          inline:
            encoding: b64
            data: |
              export PATH="/opt/bin:$PATH"

      - path: /etc/kubernetes/kubelet.conf
        permissions: 600
        content:
          inline:
            encoding: b64
            data: |
              apiVersion: kubelet.config.k8s.io/v1beta1
              kind: KubeletConfiguration
              authentication:
                anonymous:
                  enabled: false
                webhook:
                  cacheTTL: 2m
                  enabled: true
                x509:
                  clientCAFile: /etc/kubernetes/pki/ca.crt
              authorization:
                mode: Webhook
                webhook:
                  cacheAuthorizedTTL: 5m0s
                  cacheUnauthorizedTTL: 30s
              cgroupDriver: systemd
              clusterDNS:
              {{- range .ClusterDNSIPs }}
              - "{{ . }}"
              {{- end }}
              clusterDomain: cluster.local
              {{- if .ContainerLogMaxSize }}
              containerLogMaxSize: {{ .ContainerLogMaxSize }}
              {{- else }}
              containerLogMaxSize: 100Mi
              {{- end }}
              {{- if .ContainerLogMaxFiles }}
              containerLogMaxFiles: {{ .ContainerLogMaxFiles }}
              {{- else }}
              containerLogMaxFiles: 5
              {{- end }}
              featureGates:
              {{- if .KubeletFeatureGates -}}
                {{ range $key, $val := .KubeletFeatureGates }}
                {{ $key }}: {{ $val }}
                {{- end -}}
              {{- end }}
              protectKernelDefaults: true
              readOnlyPort: 0
              rotateCertificates: true
              serverTLSBootstrap: true
              staticPodPath: /etc/kubernetes/manifests
              # Enable parallel image pulling.
              serializeImagePulls: false
              # Set max parallel image pulls to 10.
              maxParallelImagePulls: 10
              kubeReserved:
              {{- if .KubeReserved -}}
                {{ range $key, $val := .KubeReserved }}
                {{ $key }}: {{ $val }}
                {{- end -}}
              {{- else }}
                cpu: 200m
                ephemeral-storage: 1Gi
                memory: 200Mi
              {{- end }}
              systemReserved:
              {{- if .SystemReserved -}}
                {{ range $key, $val := .SystemReserved }}
                {{ $key }}: {{ $val }}
                {{- end -}}
              {{- else }}
                cpu: 200m
                ephemeral-storage: 1Gi
                memory: 200Mi
              {{- end }}
              evictionHard:
              {{- if .EvictionHard -}}
                {{ range $key, $val := .EvictionHard }}
                {{ $key }}: {{ $val }}
                {{- end -}}
              {{- else }}
                imagefs.available: 15%
                memory.available: 100Mi
                nodefs.available: 10%
                nodefs.inodesFree: 5%
              {{- end }}
              {{- with .MaxPods }}
              maxPods: {{ . }}
              {{- end }}
              {{- with .ImageGCHighThresholdPercent }}
              imageGCHighThresholdPercent: {{ . }}
              {{- end }}
              {{- with .ImageGCLowThresholdPercent }}
              imageGCLowThresholdPercent: {{ . }}
              {{- end }}
              {{- with .ImageMinimumGCAge }}
              imageMinimumGCAge: {{ . }}
              {{- end }}
              {{- with .ImageMaximumGCAge }}
              imageMaximumGCAge: {{ . }}
              {{- end }}
              tlsCipherSuites:
              - TLS_AES_128_GCM_SHA256
              - TLS_AES_256_GCM_SHA384
              - TLS_CHACHA20_POLY1305_SHA256
              - TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256
              - TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384
              - TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305
              - TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
              - TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
              - TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305
              volumePluginDir: /var/lib/kubelet/volumeplugins
              resolvConf: /run/systemd/resolve/resolv.conf

      - path: /opt/disable-swap.sh
        permissions: 755
        content:
          inline:
            encoding: b64
            data: |
              #!/usr/bin/env bash
              set -euo pipefail

              # Make sure we always disable swap - Otherwise the kubelet won't start as for some cloud
              # providers swap gets enabled on reboot or after the setup script has finished executing.
              sed -i.orig '/.*swap.*/d' /etc/fstab
              swapoff -a

      # Disable core dumps for SUID/privileged binaries and the magic SysRq key.
      - path: /etc/sysctl.d/98-hardening.conf
        content:
          inline:
            encoding: b64
            data: |
              fs.suid_dumpable = 0
              kernel.sysrq = 0

      # Harden the BPF JIT and restrict BPF usage to privileged processes.
      - path: /etc/sysctl.d/98-bpf-hardening.conf
        content:
          inline:
            encoding: b64
            data: |
              net.core.bpf_jit_harden = 1
              net.core.bpf_jit_enable = 1
              kernel.unprivileged_bpf_disabled = 1

      # Hard/symlink, FIFO and regular-file open protection.
      #
      # THE FILENAME IS LOAD-BEARING. This must sort after
      # /usr/lib/sysctl.d/99-protect-links.conf, which ships fs.protected_fifos = 1.
      # `sysctl --system` collects drop-ins from /etc/sysctl.d, /run/sysctl.d and
      # /usr/lib/sysctl.d, applies them in BASENAME order, and the last write wins -
      # so these values in 98-hardening.conf above would be silently reverted.
      # All four are restated so the outcome does not depend on what an earlier file
      # happened to set.
      #
      # No Kubernetes impact: raising protected_fifos from 1 to 2 only extends the
      # FIFO-open restriction from world-writable sticky directories to group-writable
      # ones, and nothing in the kubelet/containerd path opens cross-owner FIFOs there.
      # kernel.yama.ptrace_scope is deliberately left alone - raising it to 3 blocks
      # ptrace for root as well and cannot be lowered again without a reboot.
      - path: /etc/sysctl.d/99-zz-hardening.conf
        content:
          inline:
            encoding: b64
            data: |
              fs.protected_hardlinks = 1
              fs.protected_symlinks = 1
              fs.protected_fifos = 2
              fs.protected_regular = 2

      # Password complexity requirements for local interactive logins.
      - path: /etc/security/pwquality.conf
        content:
          inline:
            encoding: b64
            data: |
              difok = 3
              minlen = 14
              minclass = 4
              maxrepeat = 3
              maxsequence = 3
              gecoscheck = 1
              usercheck = 1
              dictcheck = 1

      # Default-deny fallback PAM service for anything not explicitly configured.
      - path: /etc/pam.d/other
        content:
          inline:
            encoding: b64
            data: |
              auth     required pam_deny.so
              auth     required pam_warn.so
              account  required pam_deny.so
              account  required pam_warn.so
              password required pam_deny.so
              password required pam_warn.so
              session  required pam_deny.so
              session  required pam_warn.so

      - path: /opt/bin/harden.sh
        permissions: 755
        content:
          inline:
            encoding: b64
            data: |
              #!/bin/bash
              # Idempotent OS hardening, invoked as the last step of /opt/bin/setup once
              # kubelet is already running. No `set -e`: every block logs a warning instead
              # of aborting, so a step failing on an unexpected image variant never breaks
              # the rest of the hardening.
              set -uo pipefail

              export LC_ALL=C DEBIAN_FRONTEND=noninteractive NEEDRESTART_SUSPEND=1

              echodate() { echo "[$(date -Is)] harden.sh:" "$@"; }

              # Password quality (the policy itself ships as /etc/security/pwquality.conf).
              apt-get install -y libpam-pwquality \
                || echodate "WARNING: libpam-pwquality install failed"

              # Lock an account after 20 failed password attempts for 15 minutes, using
              # pam_faillock (pam_tally2 was removed upstream and does not exist on
              # Ubuntu 24.04). The policy is written inline on the PAM lines as well as
              # into faillock.conf: inline options win, and keeping faillock.conf in sync
              # means the `faillock` CLI reports the same policy.
              #
              # Deliberately no `account required pam_faillock.so` line: without it the
              # lockout applies to password authentication only, so a locked-out operator
              # still has SSH key access. Adding it would turn a 15-minute nuisance into a
              # potential loss of access to the node. Nothing here is irreversible - the
              # lock expires on its own - and root is not locked out.
              #
              # Runs after the libpam-pwquality install above, because that install
              # triggers pam-auth-update, which rewrites common-auth.
              {
                FC=/etc/security/faillock.conf
                CA=/etc/pam.d/common-auth

                sed -i -E '/^[[:blank:]]*(deny|unlock_time|audit|silent)[[:blank:]]*(=|$)/d' "$FC"
                printf '%s\n' 'audit' 'deny = 20' 'unlock_time = 900' >> "$FC"

                # Wire faillock around pam_unix, once. pam_unix carries
                # [success=1 default=ignore]: on success it skips exactly one line
                # (authfail) and lands on authsucc, which clears the counter; on failure it
                # falls through to authfail, which dies. This is the standard layout.
                if ! grep -q 'pam_faillock\.so' "$CA"; then
                  cp -p "$CA" "$CA.orig"
                  sed -i -E '0,/^auth[[:blank:]].*pam_unix\.so/{s|^(auth[[:blank:]].*pam_unix\.so.*)$|auth\trequired\t\t\tpam_faillock.so preauth audit deny=20 unlock_time=900\n\1\nauth\t[default=die]\t\t\tpam_faillock.so authfail audit deny=20 unlock_time=900\nauth\tsufficient\t\t\tpam_faillock.so authsucc audit deny=20 unlock_time=900|}' "$CA"
                fi

                # Verify, and restore the backup rather than leave a broken auth stack.
                # Anchored on ^auth: a mangled line still contains the module name, so an
                # unanchored grep would not catch it.
                if grep -qE '^auth[[:blank:]]+required[[:blank:]]+pam_faillock\.so preauth audit deny=20 unlock_time=900$' "$CA" \
                   && grep -qE '^auth[[:blank:]]+\[default=die\][[:blank:]]+pam_faillock\.so authfail audit deny=20 unlock_time=900$' "$CA" \
                   && grep -qE '^auth[[:blank:]]+sufficient[[:blank:]]+pam_faillock\.so authsucc audit deny=20 unlock_time=900$' "$CA" \
                   && grep -qE '^auth[[:blank:]].*pam_unix\.so' "$CA"; then
                  echodate "pam_faillock wired into common-auth: 20 failed attempts -> 900s lockout"
                else
                  echodate "WARNING: common-auth does not look right after the faillock edit - restoring backup"
                  [ -f "$CA.orig" ] && cp -p "$CA.orig" "$CA"
                fi
              } || echodate "WARNING: faillock setup had a non-fatal issue"

              # Remember the last 24 passwords so they cannot be reused. The module is
              # inserted ahead of pam_unix, which is where it has to sit to see the new
              # password before pam_unix stores it. use_authtok is deliberately left off
              # so the module obtains the token itself rather than depending on a
              # preceding module having already set it.
              {
                RX='^[[:blank:]]*password[[:blank:]]*required[[:blank:]]*pam_pwhistory\.so[[:blank:]]*remember=24$'
                if grep -qE "$RX" /etc/pam.d/common-password; then
                  :
                elif grep -q 'pam_pwhistory.so' /etc/pam.d/common-password; then
                  sed -i -E 's/^[[:blank:]]*password[[:blank:]]+required[[:blank:]]+pam_pwhistory\.so.*/password required pam_pwhistory.so remember=24/' /etc/pam.d/common-password
                else
                  sed -i -E '/pam_unix\.so/i password required pam_pwhistory.so remember=24' /etc/pam.d/common-password
                fi
              } || echodate "WARNING: pam_pwhistory insertion did not match /etc/pam.d/common-password - skipped, verify manually"

              # Password aging policy.
              {
                sed -i -E 's/^PASS_MAX_DAYS.*/PASS_MAX_DAYS\t180/' /etc/login.defs
                sed -i -E 's/^PASS_MIN_DAYS.*/PASS_MIN_DAYS\t1/' /etc/login.defs
                sed -i -E 's/^PASS_WARN_AGE.*/PASS_WARN_AGE\t30/' /etc/login.defs
                grep -q '^PASS_MAX_DAYS' /etc/login.defs || echo -e 'PASS_MAX_DAYS\t180' >> /etc/login.defs
                grep -q '^PASS_MIN_DAYS' /etc/login.defs || echo -e 'PASS_MIN_DAYS\t1' >> /etc/login.defs
                grep -q '^PASS_WARN_AGE' /etc/login.defs || echo -e 'PASS_WARN_AGE\t30' >> /etc/login.defs
              } || echodate "WARNING: password aging update had a non-fatal issue"

              # Disable accounts 30 days after their password expires. This sets the
              # default in /etc/default/useradd, so it applies to NEW accounts only.
              # Existing accounts are deliberately not touched with `chage -I`: account
              # inactivity is enforced by PAM account management, so it blocks SSH logins
              # even with key authentication, which on a long-lived node is a real
              # lockout path rather than just a password policy.
              {
                useradd -D -f 30
              } || echodate "WARNING: could not set the INACTIVE default in /etc/default/useradd"

              # Default umask for interactive shells.
              {
                sed -i -E 's/^UMASK.*/UMASK\t\t027/' /etc/login.defs
                grep -q '^UMASK' /etc/login.defs || echo -e 'UMASK\t\t027' >> /etc/login.defs
              } || echodate "WARNING: UMASK update had a non-fatal issue"

              # Restrict su to the sudo group. group=sudo is pinned explicitly because a bare
              # pam_wheel.so defaults to GID 0, which the cloud-init admin account is not a
              # member of, and would lock it out of su entirely. Both the guard and the
              # insertion anchor require a line starting with "auth" so that the commented-out
              # examples in Ubuntu's stock /etc/pam.d/su are not read as active directives.
              {
                if ! grep -qE '^[[:space:]]*auth[[:space:]]+.*pam_wheel\.so' /etc/pam.d/su 2>/dev/null; then
                  sed -i -E '/^[[:space:]]*auth[[:space:]]+.*pam_rootok\.so/a auth\t\trequired\tpam_wheel.so use_uid group=sudo' /etc/pam.d/su
                fi
              } || echodate "WARNING: pam_wheel insertion did not match /etc/pam.d/su - skipped, verify manually"

              # Block kernel modules a Kubernetes node has no use for: uncommon
              # filesystems, legacy network protocols, wireless drivers and USB storage.
              # The `install <mod> /bin/true` form is used rather than `blacklist`,
              # because it also defeats an explicit `modprobe`.
              #
              # There is no overlap between this list and anything CNI, CSI or kube-proxy
              # needs - overlay, br_netfilter, vxlan, wireguard, ip_vs*, nf_conntrack,
              # iscsi_tcp, nfs, rbd, ceph, dm_* and virtio_* are all absent from it.
              #
              # kernel.modules_disabled is deliberately NOT set: it is a one-way lock, and
              # /opt/load-kernel-modules.sh runs as an ExecStartPre of kubelet.service
              # under `set -euo pipefail`. If the lock won that race on any boot, the
              # modprobe would fail, the unit would fail, and the node would never go Ready.
              #
              # Blocking a module that is CURRENTLY LOADED is a deferred outage: everything
              # keeps working until the next reboot, then breaks. So any module found
              # loaded is skipped, left commented out in the file, and reported loudly -
              # if a workload is using e.g. SCTP, the module is loaded and stays usable.
              {
                BL=/etc/modprobe.d/99-hardening-blacklist.conf
                mkdir -p /etc/modprobe.d
                MODS="cramfs freevxfs jffs2 hfs hfsplus squashfs udf dccp sctp rds tipc ax25 netrom x25 rose decnet econet af_802154 firewire-sbp2 sbp2 ohci1394 dv1394 raw1394 video1394 firewire-ohci ath brcm80211 iwlegacy iwlwifi mwifiex rt2x00 rtl818x rtlwifi usb-storage"

                LOADED=$(lsmod 2>/dev/null | awk 'NR>1{print $1}')
                SKIPPED=""; ARMED=0

                {
                  echo "# Modules found loaded at provisioning time are left commented out"
                  echo "# below rather than blocked, to avoid a failure that would only"
                  echo "# appear at the next reboot."
                } > "$BL"

                for m in $MODS; do
                  # lsmod reports underscores where module names use hyphens
                  norm=$(printf '%s' "$m" | tr '-' '_')
                  if printf '%s\n' "$LOADED" | grep -qx "$norm"; then
                    SKIPPED="$SKIPPED $m"
                    echo "# SKIPPED - currently loaded: install $m /bin/true" >> "$BL"
                  else
                    echo "install $m /bin/true" >> "$BL"
                    ARMED=$((ARMED+1))
                  fi
                done
                chown root:root "$BL"; chmod 0644 "$BL"

                if [ -n "$SKIPPED" ]; then
                  echodate "WARNING: these modules are LOADED and were NOT blocked -$SKIPPED"
                  echodate "WARNING: something is using them, investigate before adding them by hand"
                fi
                # Verify what actually landed - never report success from a counter alone.
                WROTE=$(grep -c '^install ' "$BL" 2>/dev/null || echo 0)
                if [ "$WROTE" -eq "$ARMED" ] && [ "$ARMED" -gt 0 ]; then
                  echodate "$WROTE modules blocked in $BL"
                else
                  echodate "WARNING: expected $ARMED install lines in $BL but found $WROTE - blacklist NOT reliably applied, inspect this node"
                fi
              } || echodate "WARNING: module blacklist step had a non-fatal issue"

              # Remove linux-modules-extra, which carries several times more modules than
              # the base package while holding nothing Kubernetes needs - ip_vs*,
              # nf_conntrack, br_netfilter, overlay, vxlan, wireguard, iscsi_tcp, nfs,
              # nfsv4, rbd, ceph and dm_thin_pool all live in the base package, and
              # linux-image does not depend on -extra.
              #
              # Same deferred-outage guard as the blacklist above: removing the package
              # does not unload anything already running, so a module in use would keep
              # working until the next reboot and then vanish. If any currently-loaded
              # module comes from -extra, the purge is skipped and reported.
              {
                EXTRA="linux-modules-extra-$(uname -r)"
                if dpkg-query -W -f='${Status}' "$EXTRA" 2>/dev/null | grep -q "ok installed"; then
                  INUSE=""
                  LOADED=$(lsmod 2>/dev/null | awk 'NR>1{print $1}')
                  # module basenames shipped by -extra, normalised the way lsmod prints them
                  EXTRA_MODS=$(dpkg -L "$EXTRA" 2>/dev/null | sed -n 's#.*/\([^/]*\)\.ko\(\.zst\)\?$#\1#p' | tr '-' '_' | sort -u)
                  for m in $LOADED; do
                    if printf '%s\n' "$EXTRA_MODS" | grep -qx "$m"; then INUSE="$INUSE $m"; fi
                  done

                  if [ -n "$INUSE" ]; then
                    echodate "WARNING: NOT removing $EXTRA - these loaded modules come from it:$INUSE"
                    echodate "WARNING: removing it would break them at the next reboot, investigate first"
                  elif apt-get -o DPkg::Lock::Timeout=300 -y purge "$EXTRA" > /dev/null 2>&1; then
                    echodate "purged $EXTRA - no loaded module came from it"
                  else
                    echodate "WARNING: purge of $EXTRA failed - left installed"
                  fi
                else
                  echodate "$EXTRA not installed, nothing to remove"
                fi
              } || echodate "WARNING: linux-modules-extra step had a non-fatal issue"

              # Disable core dumps via limits (the sysctl side ships as a static file).
              {
                grep -qE '^\*[[:space:]]+hard[[:space:]]+core[[:space:]]+0[[:space:]]*$' /etc/security/limits.conf \
                  || echo '*    hard    core    0' >> /etc/security/limits.conf
              } || echodate "WARNING: limits.conf update had a non-fatal issue"

              # Restrict cron/at to root. /etc/at.allow can be absent when at is not
              # installed, so create both files before changing owner and mode.
              {
                [ -f /etc/cron.allow ] || echo root > /etc/cron.allow
                [ -f /etc/at.allow ] || echo root > /etc/at.allow
                rm -f /etc/cron.deny /etc/at.deny
                chown root:root /etc/cron.allow /etc/at.allow
                chmod 730 /etc/cron.allow /etc/at.allow
              } || echodate "WARNING: cron/at allow-list step had a non-fatal issue"

              # Empty the pre-login banners.
              { : > /etc/issue; : > /etc/issue.net; } || echodate "WARNING: could not empty /etc/issue(.net)"

              # Show last-login information at console login. Ubuntu ships this line
              # commented out in /etc/pam.d/login, so prefer uncommenting it in place
              # over appending a second one. The guard matches the active directive in
              # either position so that re-running this script cannot add a duplicate.
              {
                RX='^[[:space:]]*session[[:blank:]]+optional[[:blank:]]+pam_lastlog\.so'
                if grep -qE "$RX" /etc/pam.d/login; then
                  :
                elif grep -qE '^[[:space:]]*#[[:space:]]*session[[:blank:]]*optional[[:blank:]]*pam_lastlog\.so' /etc/pam.d/login; then
                  sed -i -E 's/^[[:space:]]*#[[:space:]]*(session[[:blank:]]*optional[[:blank:]]*pam_lastlog\.so.*)/\1/' /etc/pam.d/login
                else
                  echo 'session optional pam_lastlog.so' >> /etc/pam.d/login
                fi
              } || echodate "WARNING: pam_lastlog insertion did not match /etc/pam.d/login - skipped, verify manually"

              # Disable crash reporting.
              {
                if grep -q '^enabled=' /etc/default/apport 2>/dev/null; then
                  sed -i 's/^enabled=.*/enabled=0/' /etc/default/apport
                else
                  echo 'enabled=0' >> /etc/default/apport
                fi
                systemctl disable --now apport.service 2>/dev/null || true
              } || echodate "WARNING: could not disable apport"

              # Turn unattended upgrades off. Updates are applied by re-provisioning the
              # node from a newer image, not in place: an unattended upgrade on a running
              # worker can swap containerd/runc out from under live containers, or move
              # kubelet outside the tested version-skew window.
              #
              # Only the APT::Periodic / Dpkg::Options lines are needed - no unit changes.
              # apt-daily.timer still fires, but apt.systemd.daily reads APT::Periodic::*
              # and does nothing at "0". /etc/apt/apt.conf.d/10periodic still carries
              # Update-Package-Lists "1", which is fine: apt.conf.d is read in lexical
              # order, so 20auto-upgrades wins. Written with printf, not a heredoc, so the
              # YAML block indentation here cannot leak into the file.
              #
              # A malformed file in apt.conf.d would break every later apt call on this
              # node - including the package removal that runs after provisioning - so the
              # whole config tree is re-parsed afterwards and the original restored if it
              # no longer parses.
              {
                AU=/etc/apt/apt.conf.d/20auto-upgrades
                AU_BAK="$(mktemp /root/.20auto-upgrades.bak.XXXXXX)"
                if [ -f "$AU" ]; then cp -p "$AU" "$AU_BAK"; fi

                printf '%s\n' \
                  'APT::Periodic::Update-Package-Lists "0";' \
                  'APT::Periodic::Unattended-Upgrade "0";' \
                  'Dpkg::Options {"--force-confdef";"--force-confold";}' > "$AU"
                chown root:root "$AU"
                chmod 0644 "$AU"

                if apt-config dump > /dev/null 2>&1; then
                  echodate "20auto-upgrades rewritten for manual updates, apt config parses"
                  rm -f "$AU_BAK"
                else
                  echodate "WARNING: apt config no longer parses after rewriting $AU - restoring the original"
                  if [ -s "$AU_BAK" ]; then cp -p "$AU_BAK" "$AU"; else rm -f "$AU"; fi
                  rm -f "$AU_BAK"
                fi
              } || echodate "WARNING: could not switch apt to manual updates"

              # Apply the sysctl drop-ins; systemd-sysctl re-applies them on every boot.
              sysctl --system || echodate "WARNING: sysctl --system reported an issue after hardening"

              echodate "hardening steps complete"

              # Hand the package removal over to a unit that runs after provisioning.
              # Nothing is removed here: cloud-init is still running above this script in
              # the call chain (its final stage waits on bootstrap.service, which waits on
              # setup.service, which runs this script), so purging it from here would pull
              # it out from under a live process. osp-final-cleanup.service is ordered
              # after all of them and does the removal once they have returned. It is also
              # enabled, so it still runs at the next boot should the node reboot first.
              {
                systemctl daemon-reload
                systemctl enable osp-final-cleanup.service
                systemctl start --no-block osp-final-cleanup.service
              } || echodate "WARNING: could not schedule osp-final-cleanup.service"

      - path: /opt/bin/final-cleanup.sh
        permissions: 755
        content:
          inline:
            encoding: b64
            data: |
              #!/bin/bash
              # Removes packages a Kubernetes node has no need for, and sweeps superseded
              # packaged conffiles. Runs LAST: started by osp-final-cleanup.service, which
              # is ordered after cloud-final.service, bootstrap.service and setup.service -
              # i.e. after cloud-init (which drives the whole bootstrap) and the
              # provisioning have returned, so it cannot cut the ground from under them.
              #
              # Purging cloud-init or snapd also purges the ubuntu-server-minimal
              # metapackage, which depends on both. Whatever that metapackage depends on or
              # recommends is therefore marked MANUAL first, so that a later
              # `apt autoremove` cannot take it. `apt autoremove` is never run here.
              #
              # On success the unit disables and deletes itself; on failure it stays
              # enabled and tries again at the next boot.
              set -uo pipefail

              LOG=/var/log/final-cleanup.log
              exec >> "$LOG" 2>&1
              echodate() { echo "[$(date -Is)] final-cleanup.sh:" "$@"; }

              export LC_ALL=C DEBIAN_FRONTEND=noninteractive NEEDRESTART_SUSPEND=1
              LOCK_TIMEOUT="${LOCK_TIMEOUT:-600}"
              RETRY_SLEEP="${RETRY_SLEEP:-30}"
              PKGS=(cloud-init snapd tcpdump telnet iputils-tracepath)
              RC=0

              # which of them are present (installed, or removed with config files left)
              mapfile -t INSTALLED < <(dpkg-query -W -f='${Package} ${db:Status-Abbrev}\n' "${PKGS[@]}" 2>/dev/null | awk '$2 != "un" {print $1}')

              if [ "${#INSTALLED[@]}" -gt 0 ]; then
                echodate "purging: ${INSTALLED[*]}"

                # what else would apt purge along with them?
                mapfile -t EXTRA < <(apt-get -s purge "${INSTALLED[@]}" 2>/dev/null | awk '/^Purg /{print $2}' \
                  | grep -vxF -f <(printf '%s\n' "${INSTALLED[@]}") || true)
                echodate "apt will also purge: ${EXTRA[*]:-nothing}"

                if [ "${#EXTRA[@]}" -gt 0 ]; then
                  DEPS=$(for m in "${EXTRA[@]}"; do dpkg-query -W -f='${Pre-Depends},${Depends},${Recommends}\n' "$m"; done \
                    | sed -e 's/[,|]/\n/g' | sed -e 's/([^)]*)//g' -e 's/^[[:space:]]*//' -e 's/[[:space:]].*$//' -e 's/:any$//' \
                    | grep -v '^$' | sort -u)
                  mapfile -t KEEP < <(comm -12 <(echo "$DEPS") <(apt-mark showauto | sort -u) \
                    | comm -23 - <(printf '%s\n' "${INSTALLED[@]}" "${EXTRA[@]}" | sort -u))
                  if [ "${#KEEP[@]}" -gt 0 ]; then
                    apt-mark manual "${KEEP[@]}" && echodate "marked manual (kept out of apt autoremove): ${KEEP[*]}"
                  fi
                fi

                # another apt/dpkg process may hold the lock right after first boot: wait for it, and retry
                n=0
                until apt-get -o DPkg::Lock::Timeout="$LOCK_TIMEOUT" -y purge "${INSTALLED[@]}"; do
                  n=$((n + 1))
                  echodate "WARNING: purge attempt $n failed"
                  if [ "$n" -ge 3 ]; then RC=1; break; fi
                  sleep "$RETRY_SLEEP"
                done
              else
                echodate "none of these is installed any more: ${PKGS[*]}"
              fi

              # Drop /snap/bin from the PATH in /etc/environment and from sudo's secure_path.
              sed -i -E "s#:/snap/bin([:\"']|[[:space:]]*\$)#\1#g; s#([\"'=])/snap/bin:#\1#g" /etc/environment \
                || echodate "WARNING: could not clean /etc/environment"

              # sudoers: edit a copy, validate it with visudo, and only then replace the real file (atomic rename)
              SUDO_NEW=$(mktemp /etc/sudoers.XXXXXX)
              if cp -p /etc/sudoers "$SUDO_NEW" \
                 && sed -i -E 's#^(Defaults[[:space:]]+secure_path="[^"]*):/snap/bin([:"])#\1\2#' "$SUDO_NEW" \
                 && visudo -cf "$SUDO_NEW" > /dev/null \
                 && chmod 0440 "$SUDO_NEW" && chown root:root "$SUDO_NEW" \
                 && mv -f "$SUDO_NEW" /etc/sudoers; then
                echodate "/etc/sudoers checked and updated"
              else
                echodate "WARNING: sudoers edit did not validate - /etc/sudoers left unchanged"
                rm -f "$SUDO_NEW"
              fi

              # Remove superseded packaged conffiles. A *.dpkg-dist file is the version a
              # package SHIPPED, written aside because the local file was kept instead -
              # which is what --force-confold does, and how they appear here: this OSP
              # writes several conffiles itself, and the packages that own them then
              # decline to overwrite them. Nothing reads these files; dpkg does not own or
              # track them and the live config is untouched, so removing one is not the
              # same as applying it.
              #
              # This runs here rather than in harden.sh on purpose: apt activity later in
              # the boot can always recreate them, so the sweep has to come after the last
              # of it - i.e. after the purge above.
              #
              # Scoped to /etc deliberately: anything under /var/lib/containerd belongs to
              # an unpacked container image layer and must be left alone, since deleting
              # inside a layer corrupts the snapshot and is undone on re-pull.
              #
              # The diff is logged before removal so "what did the new package want?"
              # survives in this log; the content is also recoverable from the package
              # itself via `apt-get download <pkg>` + `dpkg-deb -x`.
              DIST_COUNT=$(find /etc -type f -name '*.dpkg-dist' 2>/dev/null | wc -l)
              if [ "$DIST_COUNT" -gt 0 ]; then
                echodate "removing $DIST_COUNT superseded packaged conffile(s) under /etc"
                find /etc -type f -name '*.dpkg-dist' 2>/dev/null | while IFS= read -r d; do
                  echodate "  $d (diff against the live file, kept for the record):"
                  diff -u "${d%.dpkg-dist}" "$d" 2>/dev/null | sed 's/^/    /' || true
                  rm -f "$d"
                done
              else
                echodate "no *.dpkg-dist files under /etc"
              fi

              if [ "$RC" -eq 0 ]; then
                echodate "done"
                systemctl disable osp-final-cleanup.service || true
                rm -f /etc/systemd/system/osp-final-cleanup.service
                systemctl daemon-reload || true
                rm -f /opt/bin/final-cleanup.sh
              else
                echodate "WARNING: the purge did not succeed - this unit stays enabled and retries at the next boot"
              fi
              exit "$RC"

      - path: /etc/systemd/system/osp-final-cleanup.service
        permissions: 644
        content:
          inline:
            encoding: b64
            data: |
              [Unit]
              Description=Remove unneeded packages once bootstrap and provisioning have finished
              # cloud-init drives the whole bootstrap: its final stage is still waiting on bootstrap.service, which waits on
              # setup.service, while setup.service runs the provisioning. This must start only after all of them have returned.
              After=cloud-final.service cloud-config.service cloud-init.service bootstrap.service setup.service

              [Service]
              Type=oneshot
              TimeoutStartSec=3600
              ExecStart=/opt/bin/final-cleanup.sh

              [Install]
              WantedBy=multi-user.target
